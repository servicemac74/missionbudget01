header {

.hdr-title { font-size: 20px; font-weight: bold; letter-spacing: -0.3px; }

.sync-badge {
  display: flex; align-items: center; gap: 5px;
  font-size: 10px; font-family: 'Courier New', monospace;
  padding: 3px 8px; border-radius: 3px;
  border: 1px solid var(--border); background: var(--paper); color: var(--muted);

.sync-badge[data-state="offline"] .sync-dot { background: var(--offline-c); }
.sync-badge[data-state="synced"]  #syncLabel { color: var(--synced-c); }

.sync-badge[data-state="offline"] #syncLabel { color: var(--offline-c); }

.summary-bar { display: flex; gap: 20px; margin-top: 10px; flex-wrap: wrap; }
.sum-item { font-size: 11px; color: var(--muted); line-height: 1.4; }
.sum-item strong {
  display: block; font-size: 15px; color: var(--ink);
  font-family: 'Courier New', monospace; font-weight: bold;
}

/* ── Week sections ── */
.week-section { border-bottom: 2px solid var(--week-rule); }
.week-hdr {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 16px 8px;
  background: var(--paper); border-bottom: 1px solid var(--col-rule);

.week-label {
  font-size: 12px; font-weight: bold;

.col { padding: 8px 10px 12px; min-height: 60px; }

.col-hdr {

.bill-card {
  display: flex; justify-content: space-between; align-items: center;
  gap: 6px; padding: 8px 9px; margin-bottom: 4px;

  background: var(--unpaid-bg);
  cursor: grab; touch-action: none; position: relative;
  transition: box-shadow 0.1s;

.bill-card:active { cursor: grabbing; }
.bill-card.paid { background: var(--paid-bg); border-color: #C0D9C4; }

.card-right { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex-shrink: 0; }
.card-amount { font-size: 13px; font-family: 'Courier New', monospace; font-weight: bold; white-space: nowrap; }
.bill-card.paid .card-amount { color: var(--paid-ink); }
.card-empty { font-size: 11px; color: var(--muted); font-style: italic; padding: 6px 0 2px; }

  font-weight: bold; color: var(--ink); box-shadow: 0 4px 16px rgba(0,0,0,0.18);
  white-space: nowrap; transform: translate(-50%, -50%);
  max-width: 200px; overflow: hidden; text-overflow: ellipsis;
}

/* ── Touch tap targets ── */
@media (pointer: coarse) {

// ── Helpers ──
function fmt(n) {
  return '$' + n.toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
}
function billById(id) {
  return BILLS.find(function(b){ return b.id === id; });
}

// ── Render ──
function draw() {
  var app = document.getElementById('app');
  var html = '';
  WEEKS.forEach(function(wk) {
    var wBills = BILLS.filter(function(b){ return b.week === wk.key; });
    var unpaid = wBills.filter(function(b){ return !b.paid; });
    var paid   = wBills.filter(function(b){ return  b.paid; });
    var wTotal = wBills.reduce(function(s,b){ return s+b.amount; }, 0);
    var wPaid  = paid.reduce(function(s,b){ return s+b.amount; }, 0);

    html += '<div class="week-section">';
    html += '<div class="week-hdr">';
    html += '<div><div class="week-label">' + wk.label + '</div>';
    html += '<div class="week-dates">' + wk.dates + '</div></div>';
    html += '<div class="week-money">Due <strong>' + fmt(wTotal) + '</strong>Paid <strong>' + fmt(wPaid) + '</strong></div>';
    html += '</div>';
    html += '<div class="cols">';
    html += '<div class="col col-unpaid" data-drop="unpaid" data-week="' + wk.key + '">';
    html += '<div class="col-hdr">UNPAID</div>';
    html += unpaid.length ? unpaid.map(cardHTML).join('') : '<div class="card-empty">All clear</div>';
    html += '</div>';
    html += '<div class="col col-paid" data-drop="paid" data-week="' + wk.key + '">';
    html += '<div class="col-hdr">PAID</div>';
    html += paid.length ? paid.map(cardHTML).join('') : '<div class="card-empty">Nothing yet</div>';
    html += '</div>';
    html += '</div></div>';
  });
  app.innerHTML = html;
  updateSummary();
  wire();
}

function cardHTML(b) {
  var paidCls = b.paid ? ' paid' : '';
  var lateTag = b.late ? '<span class="tag tag-late">carryover</span>' : '';
  return '<div class="bill-card' + paidCls + '" draggable="true" data-id="' + b.id + '" data-week="' + b.week + '">'
    + '<div class="card-left"><div class="card-name">' + b.name + '</div>'
    + '<div class="card-tags">'
    + '<span class="tag tag-' + (b.type === 'automated' ? 'auto' : 'manual') + '">' + (b.type === 'automated' ? 'auto' : 'manual') + '</span>'
    + '<span class="tag tag-' + b.cat + '">' + b.cat + '</span>'
    + lateTag + '</div></div>'
    + '<div class="card-right"><div class="card-amount">' + fmt(b.amount) + '</div></div>'
    + '</div>';
}

function updateSummary() {
  var total   = BILLS.reduce(function(s,b){ return s+b.amount; }, 0);
  var paidAmt = BILLS.filter(function(b){ return b.paid; }).reduce(function(s,b){ return s+b.amount; }, 0);
  var paidCnt = BILLS.filter(function(b){ return b.paid; }).length;
  document.getElementById('sumTotal').textContent = fmt(total);
  document.getElementById('sumPaid').textContent  = fmt(paidAmt);
  document.getElementById('sumLeft').textContent  = fmt(total - paidAmt);
  document.getElementById('sumCount').textContent = paidCnt + ' / ' + BILLS.length;
}

// ── Drop logic (shared by desktop and touch bridge) ──
// SYNC INVARIANT: Any change here MUST also be applied to _applyDrop() in the touch bridge.
function applyDrop(billId, targetPaid, targetWeek) {
  var bill = billById(billId);
  if (!bill) return;
  if (bill.week !== targetWeek) return;  // week-scoped — cross-week drop is no-op
  if (bill.paid === targetPaid) return;  // same state — no-op
  bill.paid = targetPaid;
  draw();
  if (typeof FB !== 'undefined') FB.scheduleWrite();
}

// ── Desktop HTML5 Drag & Drop ──
function wire() {
  document.querySelectorAll('.bill-card[draggable]').forEach(function(card) {
    card.addEventListener('dragstart', function(e) {
      e.dataTransfer.setData('text/plain', card.dataset.id);
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(function(){ card.classList.add('dragging'); }, 0);
    });
    card.addEventListener('dragend', function() {
      card.classList.remove('dragging');
    });
  });
  document.querySelectorAll('.col[data-drop]').forEach(function(col) {
    col.addEventListener('dragover', function(e) {
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      col.classList.add('drag-over');
    });
    col.addEventListener('dragleave', function(e) {
      if (!col.contains(e.relatedTarget)) col.classList.remove('drag-over');
    });
    col.addEventListener('drop', function(e) {
      e.preventDefault(); col.classList.remove('drag-over');
      var id    = e.dataTransfer.getData('text/plain');
      var tPaid = col.dataset.drop === 'paid';
      var tWeek = col.dataset.week;
      applyDrop(id, tPaid, tWeek);
    });
  });
}

  // EDITABLE PER MONTH: update to budget/bills/{month_key}
  var SESSION_KEY = 'budget/bills/sept_2026'; // EDITABLE: update to budget/bills/{month_key}

  var _db = null, _sessionRef = null, _writeTimer = null;
  var _lastSavedAt = null, _initialized = false, _listenerOn = false;

  function _setStatus(state, label) {
    var badge = document.getElementById('syncBadge');
    var lbl   = document.getElementById('syncLabel');
    if (badge) badge.setAttribute('data-state', state);
    if (lbl)   lbl.textContent = label || state;
  }

  function _buildPayload() {
    var changes = {};
    BILLS.forEach(function(b){ changes[b.id] = b.paid; });
    return { changes: changes, savedAt: new Date().toISOString() };
  }

  function _applyPayload(data) {
    if (!data || !data.changes) return;
    var changed = false;
    BILLS.forEach(function(b){
      if (b.id in data.changes && b.paid !== data.changes[b.id]) {
        b.paid = data.changes[b.id]; changed = true;
      }
    });
    if (changed) draw();
  }

  function _doWrite() {
    if (!_sessionRef) return;
    _setStatus('syncing', 'syncing...');
    var payload = _buildPayload();
    _lastSavedAt = payload.savedAt;
    _sessionRef.set(payload)
      .then(function()  { _setStatus('synced', 'synced'); })
      .catch(function() { _setStatus('offline', 'offline'); });
  }

  function scheduleWrite() {
    if (!_initialized) return;
    clearTimeout(_writeTimer);
    _writeTimer = setTimeout(_doWrite, 300);
  }

  function init() {
    try {
      if (typeof firebase === 'undefined' || !firebase.app) { _setStatus('offline', 'offline'); return; }
      var app = firebase.apps.length ? firebase.app() : firebase.initializeApp(_config);
      _db = firebase.database(app);
      _sessionRef = _db.ref(SESSION_KEY);
      _initialized = true;
      _setStatus('syncing', 'loading...');
      _sessionRef.once('value')
        .then(function(snap) {
          var data = snap.val();
          if (data && data.savedAt) { _lastSavedAt = data.savedAt; _applyPayload(data); }
          _setStatus('synced', 'synced');
          if (!_listenerOn) {
            _listenerOn = true;
            _sessionRef.on('value', function(snap2) {
              var remote = snap2.val();
              if (!remote || !remote.savedAt) return;
              if (_lastSavedAt && remote.savedAt <= _lastSavedAt) return;
              _lastSavedAt = remote.savedAt;
              _setStatus('syncing', 'syncing...');
              _applyPayload(remote);
              _setStatus('synced', 'synced');
            });
          }
        })
        .catch(function() { _setStatus('offline', 'offline'); });
    } catch(e) { _setStatus('offline', 'offline'); }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    setTimeout(init, 100);
  }

  return { scheduleWrite: scheduleWrite };
})();

(function() {
  var VAPID_KEY = 'BITDVXdf1nWavtpCJbttjvVUUsuOxyPFirMBYqtw2RzJVbnVTSZKNfTGk64pphhNdsvrDqwH1gPDfedPsh2vLyU';
  var LS_KEY    = 'budgetUser';

  function registerToken(budgetUser) {
    try {
      if (typeof firebase === 'undefined' || !firebase.messaging) {
        console.log('[FCM] Messaging SDK not available — skipping token registration.');
        return;
      }
      var messaging = firebase.messaging();
      Notification.requestPermission().then(function(permission) {
        if (permission !== 'granted') {
          console.log('[FCM] Notification permission denied — skipping token registration.');
          return;
        }
        messaging.getToken({ vapidKey: VAPID_KEY }).then(function(token) {
          if (!token) {
            console.log('[FCM] No token returned — SW may not be ready yet.');
            return;
          }
          var app      = firebase.apps.length ? firebase.app() : null;
          if (!app) { console.log('[FCM] No Firebase app — skipping token write.'); return; }
          var db       = firebase.database(app);
          var tokenRef = db.ref('users/' + budgetUser + '/fcmTokens/budget');
          tokenRef.set({ token: token, updated: new Date().toISOString() })
            .then(function() {
              console.log('[FCM] Token written for user:', budgetUser);
            })
            .catch(function(err) {
              console.log('[FCM] Token write failed:', err);
            });
        }).catch(function(err) {
          console.log('[FCM] getToken failed:', err);
        });
      }).catch(function(err) {
        console.log('[FCM] requestPermission failed:', err);
      });
    } catch(e) {
      console.log('[FCM] Unexpected error in token registration:', e);
    }
  }

  function initUserAndFCM() {
    var stored = localStorage.getItem(LS_KEY);
    if (stored === 'chris' || stored === 'inez') {
      // Already selected — go straight to token registration
      registerToken(stored);

    // Show selector modal

    var btnInez     = document.getElementById('userBtnInez');
    if (!modal || !btnChris || !btnInez) return;
    modal.classList.add('visible');

    function selectUser(name) {
      localStorage.setItem(LS_KEY, name);
      modal.classList.remove('visible');
      registerToken(name);
    }
    btnChris.addEventListener('click', function() { selectUser('chris'); });
    btnInez.addEventListener('click',  function() { selectUser('inez');  });
  }

  // Run after DOM and Firebase are ready
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initUserAndFCM);
  } else {
    setTimeout(initUserAndFCM, 200);
  }
})();

// ── TOUCH-TO-DRAG BRIDGE ──────────────────────────────────────────────────────
// LOCKED. Do not edit. Mirrors dashboard_template_v8/v12 pattern exactly.
// SYNC INVARIANT (permanent): _applyDrop() below must mirror applyDrop() above.
// Any change to applyDrop() MUST also be applied here. See spec §6.2 and §16.4.
(function(){
  var ghost = document.getElementById('touchGhost');
  var dragging = null, startX = 0, startY = 0, moved = false;
  var MOVE_THRESHOLD = 6;

  function _applyDrop(el) {
    // SYNC INVARIANT — mirror of applyDrop() above
    if (!dragging || !el) return;
    var col = el.closest ? el.closest('.col[data-drop]') : null;
    if (!col) return;
    var tPaid = col.dataset.drop === 'paid';
    var tWeek = col.dataset.week;
    applyDrop(dragging.billId, tPaid, tWeek);
  }

  function _cleanup() {
    if (dragging) {
      var src = document.querySelector('.bill-card[data-id="' + dragging.billId + '"]');
      if (src) src.classList.remove('dragging');
    }
    dragging = null; moved = false;
    ghost.style.display = 'none';
    document.querySelectorAll('.col.drag-over').forEach(function(c){ c.classList.remove('drag-over'); });
  }

  document.addEventListener('touchstart', function(e) {
    var touch = e.touches[0];
    if (touch.target.closest('button, input, select, textarea')) return;
    var card = touch.target.closest('.bill-card[data-id]');
    if (!card) return;
    startX = touch.clientX; startY = touch.clientY; moved = false;
    dragging = { billId: card.dataset.id, week: card.dataset.week };
  }, { passive: true });

  document.addEventListener('touchmove', function(e) {
    if (!dragging) return;
    var touch = e.touches[0];
    var dx = touch.clientX - startX, dy = touch.clientY - startY;
    if (!moved && Math.sqrt(dx*dx + dy*dy) > MOVE_THRESHOLD) {
      moved = true;
      var src = document.querySelector('.bill-card[data-id="' + dragging.billId + '"]');
      if (src) src.classList.add('dragging');
      var bill = billById(dragging.billId);
      if (bill) {
        ghost.textContent = bill.name + ' ' + fmt(bill.amount);
        ghost.style.display = 'block';
      }
    }
    if (moved) {
      ghost.style.left = touch.clientX + 'px'; ghost.style.top = touch.clientY + 'px';
      ghost.style.display = 'none';
      var el = document.elementFromPoint(touch.clientX, touch.clientY);
      ghost.style.display = 'block';
      document.querySelectorAll('.col.drag-over').forEach(function(c){ c.classList.remove('drag-over'); });
      if (el) { var col = el.closest ? el.closest('.col[data-drop]') : null; if (col) col.classList.add('drag-over'); }
    }
  }, { passive: true });

  document.addEventListener('touchend', function(e) {
    if (!dragging) return;
    if (moved) {
      var touch = e.changedTouches[0];
      ghost.style.display = 'none';
      var el = document.elementFromPoint(touch.clientX, touch.clientY);
      ghost.style.display = 'block';
      _applyDrop(el);
      if (typeof FB !== 'undefined') FB.scheduleWrite();
    }
    _cleanup();
  }, { passive: true });

  document.addEventListener('touchcancel', function(){ _cleanup(); }, { passive: true });
})();
// ── END TOUCH-TO-DRAG BRIDGE ──────────────────────────────────────────────────

// Initial render
draw();
