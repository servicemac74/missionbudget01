<style>
/* ── Tokens ── */
:root {
  --ink:        #15201C;
  --paper:      #F3F1EA;
  --muted:      #8A8A82;
  --border:     #D8D5CC;
  --week-rule:  #B8B4A8;
  --col-rule:   #D8D5CC;

  --unpaid-bg:  #FFFDF8;
  --paid-bg:    #EDF4EE;
  --paid-ink:   #2A6030;
  --paid-strike:#8BBD93;

  --auto-bg:    #EEEDFE;  --auto-ink:  #3C3489;
  --manual-bg:  #FEF3E0;  --manual-ink:#7A4800;
  --debt-bg:    #FDECEA;  --debt-ink:  #9B2020;
  --util-bg:    #E0EFF5;  --util-ink:  #0C5A6E;
  --biz-bg:     #EEEDFE;  --biz-ink:   #3C3489;
  --ent-bg:     #E5F0FB;  --ent-ink:   #0C447C;
  --med-bg:     #E0F4EC;  --med-ink:   #085041;
  --other-bg:   #F0EEE8;  --other-ink: #444441;

  --late-bg:    #FFF0E0;  --late-ink:  #8B4000;

  --synced-c:   #2A6030;
  --syncing-c:  #7A6000;
  --offline-c:  #9B2020;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Georgia', serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  padding-bottom: 80px;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

/* ── Header ── */
header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--paper);
  border-bottom: 2px solid var(--ink);
  padding: 16px 16px 10px;
}
.hdr-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}
.hdr-title {
  font-size: 20px;
  font-weight: bold;
  letter-spacing: -0.3px;
}
.sync-badge {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 10px;
  font-family: 'Courier New', monospace;
  padding: 3px 8px;
  border-radius: 3px;
  border: 1px solid var(--border);
  background: var(--paper);
  color: var(--muted);
}
.sync-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--muted);
  flex-shrink: 0;
}
.sync-badge[data-state="synced"]  .sync-dot { background: var(--synced-c); }
.sync-badge[data-state="syncing"] .sync-dot { background: var(--syncing-c); }
.sync-badge[data-state="offline"] .sync-dot { background: var(--offline-c); }
.sync-badge[data-state="synced"]  #syncLabel { color: var(--synced-c); }
.sync-badge[data-state="syncing"] #syncLabel { color: var(--syncing-c); }
.sync-badge[data-state="offline"] #syncLabel { color: var(--offline-c); }

.summary-bar {
  display: flex;
  gap: 20px;
  margin-top: 10px;
  flex-wrap: wrap;
}
.sum-item {
  font-size: 11px;
  color: var(--muted);
  line-height: 1.4;
}
.sum-item strong {
  display: block;
  font-size: 15px;
  color: var(--ink);
  font-family: 'Courier New', monospace;
  font-weight: bold;
}

/* ── Week sections ── */
.week-section { border-bottom: 2px solid var(--week-rule); }

.week-hdr {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px 8px;
  background: var(--paper);
  border-bottom: 1px solid var(--col-rule);
}
.week-label {
  font-size: 12px;
  font-weight: bold;
  font-family: 'Courier New', monospace;
  letter-spacing: 0.8px;
  text-transform: uppercase;
}
.week-dates { font-size: 11px; color: var(--muted); }
.week-money {
  font-size: 11px;
  text-align: right;
  color: var(--muted);
}
.week-money strong {
  display: block;
  font-family: 'Courier New', monospace;
  color: var(--ink);
  font-size: 13px;
}

/* ── Columns ── */
.cols {
  display: grid;
  grid-template-columns: 1fr 1fr;
}
.col {
  padding: 8px 10px 12px;
  min-height: 60px;
}
.col-unpaid { border-right: 1px solid var(--col-rule); }

.col-hdr {
  font-size: 9px;
  font-family: 'Courier New', monospace;
  letter-spacing: 1.2px;
  color: var(--muted);
  padding-bottom: 5px;
  margin-bottom: 5px;
  border-bottom: 1px solid var(--col-rule);
}
.col-unpaid .col-hdr { color: #8A3A20; }
.col-paid   .col-hdr { color: var(--paid-ink); }

/* Drop zone highlight */
.col.drag-over { background: rgba(40,100,50,0.06); outline: 2px dashed var(--paid-ink); outline-offset: -2px; }
.col-unpaid.drag-over { background: rgba(150,60,20,0.05); outline-color: #8A3A20; }

/* ── Bill cards ── */
.bill-card {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  padding: 8px 9px;
  margin-bottom: 4px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--unpaid-bg);
  cursor: grab;
  touch-action: none;
  position: relative;
  transition: box-shadow 0.1s;
}
.bill-card:active { cursor: grabbing; }
.bill-card.paid {
  background: var(--paid-bg);
  border-color: #C0D9C4;
}
.bill-card.dragging {
  opacity: 0.35;
}

.card-left { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.card-name {
  font-size: 12px;
  font-weight: bold;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.bill-card.paid .card-name {
  color: var(--paid-ink);
  text-decoration: line-through;
  text-decoration-color: var(--paid-strike);
}
.card-tags { display: flex; gap: 3px; flex-wrap: wrap; }
.tag {
  font-size: 8px;
  padding: 1px 4px;
  border-radius: 2px;
  font-family: 'Courier New', monospace;
  white-space: nowrap;
}
.tag-auto    { background: var(--auto-bg);   color: var(--auto-ink); }
.tag-manual  { background: var(--manual-bg); color: var(--manual-ink); }
.tag-DEBT    { background: var(--debt-bg);   color: var(--debt-ink); }
.tag-UTIL    { background: var(--util-bg);   color: var(--util-ink); }
.tag-BUSINESS{ background: var(--biz-bg);    color: var(--biz-ink); }
.tag-ENT     { background: var(--ent-bg);    color: var(--ent-ink); }
.tag-MED     { background: var(--med-bg);    color: var(--med-ink); }
.tag-RANDOM  { background: var(--other-bg);  color: var(--other-ink); }
.tag-late    { background: var(--late-bg);   color: var(--late-ink); }

.card-right { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex-shrink: 0; }
.card-amount {
  font-size: 13px;
  font-family: 'Courier New', monospace;
  font-weight: bold;
  white-space: nowrap;
}
.bill-card.paid .card-amount { color: var(--paid-ink); }

.card-empty {
  font-size: 11px;
  color: var(--muted);
  font-style: italic;
  padding: 6px 0 2px;
}

/* Touch ghost */
.touch-drag-ghost {
  position: fixed;
  display: none;
  pointer-events: none;
  z-index: 9999;
  background: var(--paper);
  border: 2px solid var(--ink);
  border-radius: 4px;
  padding: 7px 10px;
  font-family: 'Georgia', serif;
  font-size: 12px;
  font-weight: bold;
  color: var(--ink);
  box-shadow: 0 4px 16px rgba(0,0,0,0.18);
  white-space: nowrap;
  transform: translate(-50%, -50%);
  max-width: 200px;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Touch tap targets */
@media (pointer: coarse) {
  .bill-card { min-height: 52px; padding: 10px 9px; }
  .card-name { font-size: 13px; }
}

@media (max-width: 420px) {
  .col { padding: 6px 7px 10px; }
  .card-amount { font-size: 12px; }
  .card-name { font-size: 11px; }
}
</style>

// ── Helpers ──
function fmt(n) {
  return '$' + n.toLocaleString('en-US', { minimumFractionDigits:2, maximumFractionDigits:2 });
}

function billById(id) {
  return BILLS.find(function(b){ return b.id === id; });
}

// ── Render ──
function draw() {
  var app = document.getElementById('app');
  var html = '';

  WEEKS.forEach(function(wk) {
    var wBills   = BILLS.filter(function(b){ return b.week === wk.key; });
    var unpaid   = wBills.filter(function(b){ return !b.paid; });
    var paid     = wBills.filter(function(b){ return  b.paid; });
    var wTotal   = wBills.reduce(function(s,b){ return s+b.amount; }, 0);
    var wPaid    = paid.reduce(function(s,b){ return s+b.amount; }, 0);

    html += '<div class="week-section">';
    html += '<div class="week-hdr">';
    html += '<div><div class="week-label">' + wk.label + '</div>';
    html += '<div class="week-dates">' + wk.dates + '</div></div>';
    html += '<div class="week-money">Due <strong>' + fmt(wTotal) + '</strong>Paid <strong>' + fmt(wPaid) + '</strong></div>';
    html += '</div>';

    html += '<div class="cols">';

    // Unpaid column
    html += '<div class="col col-unpaid" data-drop="unpaid" data-week="' + wk.key + '">';
    html += '<div class="col-hdr">UNPAID</div>';
    if (unpaid.length === 0) {
      html += '<div class="card-empty">All clear</div>';
    } else {
      unpaid.forEach(function(b){ html += cardHTML(b); });
    }
    html += '</div>';

    // Paid column
    html += '<div class="col col-paid" data-drop="paid" data-week="' + wk.key + '">';
    html += '<div class="col-hdr">PAID</div>';
    if (paid.length === 0) {
      html += '<div class="card-empty">Nothing yet</div>';
    } else {
      paid.forEach(function(b){ html += cardHTML(b); });
    }
    html += '</div>';

    html += '</div></div>'; // .cols .week-section
  });

  app.innerHTML = html;
  updateSummary();
  wire();
}

function cardHTML(b) {
  var paidCls  = b.paid ? ' paid' : '';
  var lateTag  = b.late ? '<span class="tag tag-late">Aug carryover</span>' : '';
  return [
    '<div class="bill-card' + paidCls + '"',
    ' draggable="true"',
    ' data-id="' + b.id + '"',
    ' data-week="' + b.week + '"',
    '>',
    '<div class="card-left">',
    '<div class="card-name">' + b.name + '</div>',
    '<div class="card-tags">',
    '<span class="tag tag-' + (b.type === 'automated' ? 'auto' : 'manual') + '">' + (b.type === 'automated' ? 'auto' : 'manual') + '</span>',
    '<span class="tag tag-' + b.cat + '">' + b.cat + '</span>',
    lateTag,
    '</div></div>',
    '<div class="card-right">',
    '<div class="card-amount">' + fmt(b.amount) + '</div>',
    '</div>',
    '</div>',
  ].join('');
}

function updateSummary() {
  var total    = BILLS.reduce(function(s,b){ return s+b.amount; }, 0);
  var paidAmt  = BILLS.filter(function(b){ return b.paid; }).reduce(function(s,b){ return s+b.amount; }, 0);
  var paidCnt  = BILLS.filter(function(b){ return b.paid; }).length;
  document.getElementById('sumTotal').textContent = fmt(total);
  document.getElementById('sumPaid').textContent  = fmt(paidAmt);
  document.getElementById('sumLeft').textContent  = fmt(total - paidAmt);
  document.getElementById('sumCount').textContent = paidCnt + ' / ' + BILLS.length;
}

// ── Apply a drop: move bill to target column within same week ──
function applyDrop(billId, targetPaid, targetWeek) {
  var bill = billById(billId);
  if (!bill) return;
  // Week-scoped: only allow drop within the same week, or a no-op if week differs
  if (bill.week !== targetWeek) return;
  // No-op if already in the target state
  if (bill.paid === targetPaid) return;
  bill.paid = targetPaid;
  draw();
  FB.scheduleWrite();
}

// ── Desktop HTML5 Drag & Drop ──
function wire() {
  // Cards — dragstart
  document.querySelectorAll('.bill-card[draggable]').forEach(function(card) {
    card.addEventListener('dragstart', function(e) {
      e.dataTransfer.setData('text/plain', card.dataset.id);
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(function(){ card.classList.add('dragging'); }, 0);
    });
    card.addEventListener('dragend', function() {
      card.classList.remove('dragging');
    });
  });

  // Drop zones
  document.querySelectorAll('.col[data-drop]').forEach(function(col) {
    col.addEventListener('dragover', function(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      col.classList.add('drag-over');
    });
    col.addEventListener('dragleave', function(e) {
      if (!col.contains(e.relatedTarget)) col.classList.remove('drag-over');
    });
    col.addEventListener('drop', function(e) {
      e.preventDefault();
      col.classList.remove('drag-over');
      var id      = e.dataTransfer.getData('text/plain');
      var tPaid   = col.dataset.drop === 'paid';
      var tWeek   = col.dataset.week;
      applyDrop(id, tPaid, tWeek);
    });
  });
}

  function _setStatus(state, label) {
    var badge = document.getElementById('syncBadge');
    var lbl   = document.getElementById('syncLabel');
    if (badge) badge.setAttribute('data-state', state);
    if (lbl)   lbl.textContent = label || state;

  function _buildPayload() {
    var changes = {};
    BILLS.forEach(function(b) { changes[b.id] = b.paid; });
    return { changes: changes, savedAt: new Date().toISOString() };
  }

  function _applyPayload(data) {
    if (!data || !data.changes) return;
    var changed = false;
    BILLS.forEach(function(b) {
      if (b.id in data.changes && b.paid !== data.changes[b.id]) {
        b.paid = data.changes[b.id];
        changed = true;
      }
    });
    if (changed) draw();
  }

  function _doWrite() {
    if (!_sessionRef) return;
    _setStatus('syncing', 'syncing...');
    var payload = _buildPayload();
    _lastSavedAt = payload.savedAt;
    _sessionRef.set(payload)
      .then(function()  { _setStatus('synced', 'synced'); })
      .catch(function() { _setStatus('offline', 'offline'); });
  }

  function scheduleWrite() {
    if (!_initialized) return;
    clearTimeout(_writeTimer);
    _writeTimer = setTimeout(_doWrite, 300);
  }

  function init() {
    try {
      if (typeof firebase === 'undefined' || !firebase.app) { _setStatus('offline', 'offline'); return; }
      var app = firebase.apps.length ? firebase.app() : firebase.initializeApp(_config);
      _db         = firebase.database(app);
      _sessionRef = _db.ref(SESSION_KEY);
      _initialized = true;
      _setStatus('syncing', 'loading...');

      // One-time read on page open
      _sessionRef.once('value')
        .then(function(snap) {
          var data = snap.val();
          if (data && data.savedAt) {
            _lastSavedAt = data.savedAt;
            _applyPayload(data);
          }
          _setStatus('synced', 'synced');

          // Attach live listener AFTER initial read
          if (!_listenerOn) {
            _listenerOn = true;
            _sessionRef.on('value', function(snap2) {
              var remote = snap2.val();
              if (!remote || !remote.savedAt) return;
              if (_lastSavedAt && remote.savedAt <= _lastSavedAt) return;
              _lastSavedAt = remote.savedAt;
              _setStatus('syncing', 'syncing...');
              _applyPayload(remote);
              _setStatus('synced', 'synced');
            });
          }
        })
        .catch(function() { _setStatus('offline', 'offline'); });

    } catch(e) { _setStatus('offline', 'offline'); }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    setTimeout(init, 100);
  }

  return { scheduleWrite: scheduleWrite };
})();
// ── END FIREBASE SYNC MODULE ──────────────────────────────────────────────────

// ── TOUCH-TO-DRAG BRIDGE ──────────────────────────────────────────────────────
// Translates touch events to the same applyDrop() calls the HTML5 DnD path uses.
// Follows the same pattern as dashboard_template_v8/v12:
//   - elementFromPoint hit test with ghost hidden
//   - ghost positioned under the finger
//   - Only touches[0] tracked; multi-touch ignored
//   - touch suppressed on buttons and inputs
//   - _applyDrop mirrors applyDrop() exactly — any change to applyDrop MUST
//     also be made here (permanent sync invariant, spec §16.4 pattern)
(function(){
  var ghost    = document.getElementById('touchGhost');
  var dragging = null;   // { billId, week }
  var startX   = 0;
  var startY   = 0;
  var moved    = false;
  var MOVE_THRESHOLD = 6; // px before drag activates

  function _applyDrop(el) {
    if (!dragging) return;
    if (!el) return;
    // Walk up to find a .col[data-drop]
    var col = el.closest ? el.closest('.col[data-drop]') : null;
    if (!col) return;
    var tPaid = col.dataset.drop === 'paid';
    var tWeek = col.dataset.week;
    applyDrop(dragging.billId, tPaid, tWeek);
  }

  function _ghostShow(text, x, y) {
    ghost.textContent = text;
    ghost.style.display = 'block';
    ghost.style.left = x + 'px';
    ghost.style.top  = y + 'px';
  }

  function _ghostHide() {
    ghost.style.display = 'none';
  }

  function _cleanup() {
    if (dragging) {
      var src = document.querySelector('.bill-card[data-id="' + dragging.billId + '"]');
      if (src) src.classList.remove('dragging');
    }
    dragging = null;
    moved    = false;
    _ghostHide();
    // Remove drag-over highlights
    document.querySelectorAll('.col.drag-over').forEach(function(c){ c.classList.remove('drag-over'); });
  }

  document.addEventListener('touchstart', function(e) {
    var touch = e.touches[0];
    var target = touch.target;
    // Suppress on interactive controls
    if (target.closest('button, input, select, textarea')) return;
    var card = target.closest('.bill-card[data-id]');
    if (!card) return;

    startX = touch.clientX;
    startY = touch.clientY;
    moved  = false;
    dragging = { billId: card.dataset.id, week: card.dataset.week };
  }, { passive: true });

  document.addEventListener('touchmove', function(e) {
    if (!dragging) return;
    var touch = e.touches[0];
    var dx = touch.clientX - startX;
    var dy = touch.clientY - startY;

    if (!moved && Math.sqrt(dx*dx + dy*dy) > MOVE_THRESHOLD) {
      moved = true;
      var src = document.querySelector('.bill-card[data-id="' + dragging.billId + '"]');
      if (src) src.classList.add('dragging');
      var bill = billById(dragging.billId);
      if (bill) _ghostShow(bill.name + ' ' + fmt(bill.amount), touch.clientX, touch.clientY);
    }

    if (moved) {
      // Update ghost position
      ghost.style.left = touch.clientX + 'px';
      ghost.style.top  = touch.clientY + 'px';

      // Hit test — hide ghost first so it doesn't intercept
      ghost.style.display = 'none';
      var el = document.elementFromPoint(touch.clientX, touch.clientY);
      ghost.style.display = 'block';

      // Highlight potential drop target
      document.querySelectorAll('.col.drag-over').forEach(function(c){ c.classList.remove('drag-over'); });
      if (el) {
        var col = el.closest ? el.closest('.col[data-drop]') : null;
        if (col) col.classList.add('drag-over');
      }
    }
  }, { passive: true });

  document.addEventListener('touchend', function(e) {
    if (!dragging) return;
    if (moved) {
      var touch = e.changedTouches[0];
      ghost.style.display = 'none';
      var el = document.elementFromPoint(touch.clientX, touch.clientY);
      ghost.style.display = 'block';
      _applyDrop(el);
    }
    _cleanup();
    // Fire FB write (applyDrop already called draw; scheduleWrite syncs state)
    if (moved) FB.scheduleWrite();
  }, { passive: true });

  document.addEventListener('touchcancel', function() {
    _cleanup();
  }, { passive: true });
})();
// ── END TOUCH-TO-DRAG BRIDGE ──────────────────────────────────────────────────

// Initial render
draw();
</script>
</body>
</html>
